<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Google</title>
    <!-- Favicon dari gambar yang diimport di Spck Editor -->
    <link rel="icon" href="/favicon.png" type="image/png">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --pink-glow: #ff69b4;
            --pink-dark: #ff1493;
            --pink-light: #fff0f5;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 10px;
            right: 10px;
            opacity: 0.5;
            font-size: 12px;
            color: var(--pink-glow);
            pointer-events: none;
        }

        /* Header & Login Button */
        header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            box-sizing: border-box;
        }

        #login-btn {
            background: transparent;
            border: 2px solid var(--pink-glow);
            color: var(--pink-glow);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--pink-glow), inset 0 0 5px var(--pink-glow);
            transition: 0.3s;
        }

        #login-btn:hover {
            transform: scale(1.1);
            background: var(--pink-glow);
            color: white;
        }

        /* Account List Container */
        .container {
            width: 90%;
            max-width: 500px;
            margin-top: 50px;
        }

        h1 {
            text-align: center;
            color: var(--pink-light);
            text-shadow: 0 0 10px var(--pink-glow);
        }

        .account-card {
            background: rgba(255, 182, 193, 0.1);
            border: 1px solid var(--pink-glow);
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.2);
            transition: 0.3s;
        }

        .account-info {
            display: flex;
            align-items: center;
        }

        .account-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--pink-glow);
            margin-right: 15px;
        }

        .account-info span {
            font-weight: bold;
            color: var(--pink-light);
        }

        .logout-btn {
            background: var(--pink-dark);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--pink-dark);
        }

        .logout-btn:hover {
            background: #ff69b4;
        }
    </style>
</head>
<body>

    <header>
        <button id="login-btn" onclick="startLogin()">+</button>
    </header>

    <div class="container">
        <h1>Daftar Akun Google</h1>
        <div id="account-list"></div>
    </div>

    <div class="watermark">Daus XD</div>

    <script>
        const CLIENT_ID = "543526756254-7n2ojrc64j2unv89qvs51kql1isnf0er.apps.googleusercontent.com";
        let accounts = JSON.parse(localStorage.getItem('google_accounts')) || [];

        function initGoogle() {
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: false
            });
        }

        function startLogin() {
            google.accounts.id.prompt(); 
        }

        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            const user = {
                id: data.sub,
                name: data.name,
                email: data.email,
                picture: data.picture
            };

            // Tambahkan ke multi-akun jika belum ada
            if (!accounts.some(acc => acc.email === user.email)) {
                accounts.push(user);
                localStorage.setItem('google_accounts', JSON.stringify(accounts));
                renderAccounts();
            }
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        }

        function renderAccounts() {
            const list = document.getElementById('account-list');
            list.innerHTML = '';
            accounts.forEach((acc, index) => {
                list.innerHTML += `
                    <div class="account-card">
                        <div class="account-info">
                            <img src="${acc.picture}" alt="Profile">
                            <span>${acc.name}</span>
                        </div>
                        <button class="logout-btn" onclick="confirmLogout(${index})">Logout</button>
                    </div>
                `;
            });
        }

        function confirmLogout(index) {
            const randomCode = Math.random().toString(36).substring(7).toUpperCase();
            const userInput = prompt(`Konfirmasi Logout.\nKetik kode ini: ${randomCode}`);

            if (userInput === randomCode) {
                accounts.splice(index, 1);
                localStorage.setItem('google_accounts', JSON.stringify(accounts));
                renderAccounts();
            } else {
                alert("Kode salah, logout dibatalkan.");
            }
        }

        window.onload = function() {
            initGoogle();
            renderAccounts();
        };
    </script>
</body>
</html>
