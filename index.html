<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Google</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --pink-main: #ff85a2;
            --pink-glow: #ffb3c6;
            --dark-pink: #4a0e1c;
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header & Navigation */
        header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            box-sizing: border-box;
        }

        .btn-add {
            background: transparent;
            border: 2px solid var(--pink-main);
            color: var(--pink-main);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--pink-main);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add:hover {
            background: var(--pink-main);
            color: white;
            box-shadow: 0 0 20px var(--pink-glow);
        }

        /* List Akun */
        .container {
            width: 90%;
            max-width: 500px;
            margin-top: 50px;
        }

        .account-card {
            background: rgba(255, 133, 162, 0.1);
            border: 2px solid var(--pink-main);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px var(--pink-main);
            backdrop-filter: blur(5px);
        }

        .account-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .account-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--pink-main);
            box-shadow: 0 0 8px var(--pink-glow);
        }

        .account-name {
            font-weight: bold;
            text-shadow: 0 0 5px var(--pink-main);
            -webkit-text-stroke: 0.5px white;
        }

        .btn-logout {
            background: #ff4d4d;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-logout:hover {
            box-shadow: 0 0 15px #ff4d4d;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 14px;
            color: rgba(255, 133, 162, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Modal / Google Sign In Hidden */
        #g_id_onload { display: none; }
    </style>
</head>
<body>

    <header>
        <button class="btn-add" onclick="triggerLogin()">+</button>
    </header>

    <div class="container">
        <h2 style="text-align: center; color: var(--pink-main);">Daftar Akun Terhubung</h2>
        <div id="account-list">
            <!-- List akun akan muncul di sini -->
        </div>
    </div>

    <div class="watermark">Daus XD</div>

    <!-- Google Login Integration -->
    <div id="g_id_onload"
         data-client_id="543526756254-7n2ojrc64j2unv89qvs51kql1isnf0er.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <script>
        // Load data dari localStorage saat startup
        let accounts = JSON.parse(localStorage.getItem('saved_accounts')) || [];

        function renderAccounts() {
            const listDiv = document.getElementById('account-list');
            listDiv.innerHTML = '';

            if (accounts.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; opacity:0.6;">Belum ada akun. Klik + untuk login.</p>';
                return;
            }

            accounts.forEach((acc, index) => {
                const card = document.createElement('div');
                card.className = 'account-card';
                card.innerHTML = `
                    <div class="account-info">
                        <img src="${acc.picture}" alt="profile">
                        <span class="account-name">${acc.name}</span>
                    </div>
                    <button class="btn-logout" onclick="logoutAccount(${index})">LOGOUT</button>
                `;
                listDiv.appendChild(card);
            });
        }

        function triggerLogin() {
            google.accounts.id.prompt();
        }

        function handleCredentialResponse(response) {
            // Decode JWT Token
            const responsePayload = decodeJwtResponse(response.credential);
            
            const newAccount = {
                id: responsePayload.sub,
                name: responsePayload.name,
                picture: responsePayload.picture,
                email: responsePayload.email
            };

            // Cek jika akun sudah ada dalam list
            const exists = accounts.find(a => a.id === newAccount.id);
            if (!exists) {
                accounts.push(newAccount);
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
                renderAccounts();
            } else {
                alert("Akun ini sudah masuk dalam list.");
            }
        }

        function decodeJwtResponse(data) {
            var base64Url = data.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function logoutAccount(index) {
            const randomCode = Math.random().toString(36).substring(7).toUpperCase();
            const userInput = prompt(`Masukkan kode konfirmasi berikut untuk logout: ${randomCode}`);

            if (userInput === randomCode) {
                accounts.splice(index, 1);
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
                renderAccounts();
                alert("Akun berhasil dihapus dari list.");
            } else {
                alert("Kode salah. Logout dibatalkan.");
            }
        }

        // Inisialisasi tampilan
        window.onload = renderAccounts;
    </script>
</body>
</html>
